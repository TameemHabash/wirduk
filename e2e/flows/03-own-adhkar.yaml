# «أذكاري»: a new chapter with a dhikr; it shows in the «الأذكار» tab and reads like any other;
# deleting it (after the question) takes it away.
appId: com.wirduk.app
name: Own adhkar
---
- runScript: ../.generated/strings.js
- openLink: wirduk://custom/new
- extendedWaitUntil:
    visible: ${output.s['custom.categoryNamePlaceholder']}
    timeout: 10000
- tapOn: ${output.s['custom.categoryNamePlaceholder']}
- inputText: E2E
- hideKeyboard
- tapOn: ${output.s['custom.create']}
- extendedWaitUntil:
    visible: ${output.s['custom.addDhikr']}
    timeout: 10000
- tapOn: ${output.s['custom.addDhikr']}
- extendedWaitUntil:
    visible: ${output.s['custom.dhikrTextPlaceholder']}
    timeout: 10000
- tapOn: ${output.s['custom.dhikrTextPlaceholder']}
- inputText: E2E dhikr
- hideKeyboard
- tapOn: ${output.s['custom.save']}
- extendedWaitUntil:
    visible: E2E dhikr
    timeout: 10000
# In the «الأذكار» tab, under «أذكاري»; it opens in the reader.
- openLink: wirduk://adhkar
- extendedWaitUntil:
    visible: ${output.s['custom.section']}
    timeout: 10000
- tapOn: E2E
- extendedWaitUntil:
    visible: E2E dhikr
    timeout: 10000
- tapOn:
    point: 50%, 45%
- extendedWaitUntil:
    visible: ${output.s['completion.line1']}
    timeout: 10000
# Deleted after the question: gone from «أذكاري».
- openLink: wirduk://custom
- extendedWaitUntil:
    visible: ${output.s['custom.manageTitle']}
    timeout: 10000
- tapOn: E2E
- extendedWaitUntil:
    visible: ${output.s['custom.deleteCategory']}
    timeout: 10000
- tapOn: ${output.s['custom.deleteCategory']}
- extendedWaitUntil:
    visible: ${output.s['custom.deleteCategoryConfirmBody']}
    timeout: 5000
- tapOn: ${output.s['audio.downloads.deleteConfirm']}
- extendedWaitUntil:
    visible: ${output.s['home.allAdhkar']}
    timeout: 10000
- assertNotVisible: E2E
