# Day 1, 09:00 (a clean install): the setup from the first step; Home has «وردك اليوم» at
# step 1 of 24 and the welcome; the morning ward is read in the reader.
appId: com.wirduk.app
name: Timeline day 1
---
- runScript: ../.generated/strings.js
- launchApp
- extendedWaitUntil:
    visible: ${output.s['adwamuha.setup.enable']}
    timeout: 30000
- tapOn: ${output.s['adwamuha.setup.enable']}
- extendedWaitUntil:
    visible: ${output.s['adwamuha.setup.fromFirst']}
    timeout: 10000
- tapOn: ${output.s['adwamuha.setup.fromFirst']}
- tapOn: ${output.s['adwamuha.setup.next']}
- extendedWaitUntil:
    visible: ${output.s['adwamuha.settingsScreen.orderTitle']}
    timeout: 10000
- tapOn: ${output.s['adwamuha.setup.next']}
- extendedWaitUntil:
    visible: ${output.s['adwamuha.setup.go']}
    timeout: 10000
- tapOn: ${output.s['adwamuha.setup.go']}
- extendedWaitUntil:
    visible: ${output.s['owner.labels.todayWard']}
    timeout: 10000
- assertVisible: ${output.s['adwamuha.message.ok']}
- runFlow: _messages.yaml
- assertVisible: ${output.raw['owner.labels.stepOf'].replace('{{step}}', '1').replace('{{total}}', '24')}
- runFlow:
    file: _read-ward.yaml
    env:
      SESSION: morning
