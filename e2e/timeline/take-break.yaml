# «طرأ عليّ ظرف» → «استراحة أسبوع»: «مساري» shows the break.
appId: com.wirduk.app
name: Timeline break
---
- runScript: ../.generated/strings.js
- launchApp
- extendedWaitUntil:
    visible: ${output.s['owner.labels.todayWard']}
    timeout: 20000
- runFlow: _messages.yaml
- openLink: wirduk://adwamuha
- scrollUntilVisible:
    element:
      text: ${output.s['adwamuha.rows.easeTitle']}
    direction: DOWN
    centerElement: true
- tapOn: ${output.s['adwamuha.rows.easeTitle']}
- extendedWaitUntil:
    visible: ${output.s['adwamuha.stepBack.break1']}
    timeout: 5000
- tapOn: ${output.s['adwamuha.stepBack.break1']}
- scrollUntilVisible:
    element:
      text: ${output.s['adwamuha.masari.breakUntil']}
    direction: UP
