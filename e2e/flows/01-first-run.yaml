# A clean install: «أدومها»'s setup opens by itself; «لاحقًا» leads to Home, which has no
# «وردك اليوم» (it is off). Started again, the setup does not open (seen for this version).
appId: com.wirduk.app
name: First run
---
- runScript: ../.generated/strings.js
# Maestro grants every permission by default; "unset" keeps a new phone's state (never asked).
- launchApp:
    permissions:
      all: unset
- extendedWaitUntil:
    visible: ${output.s['adwamuha.setup.enable']}
    timeout: 30000
- tapOn: ${output.s['adwamuha.later']}
- extendedWaitUntil:
    visible: ${output.s['home.start']}
    timeout: 10000
- assertNotVisible: ${output.s['owner.labels.todayWard']}
- stopApp
- launchApp:
    permissions:
      all: unset
- extendedWaitUntil:
    visible: ${output.s['home.start']}
    timeout: 15000
- assertNotVisible: ${output.s['adwamuha.setup.enable']}
